<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Games - RoBo_Go</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link href="style.css" rel="stylesheet" type="text/css" media="all">
  <link rel="stylesheet" href="https://unpkg.com/7.css">
</head>

<body>
  <main class="container">
    <div class="card">

      <div class="header-inner">
        <h1 style="user-select: none;">RoBo_Go</h1>
      </div>

      <!-- Navigation bar -->
      <nav class="topbar">
        <ul class="links">

          <li>
            <a href="https://robo-go.is-a.dev">
              <img src="Home.png"
                   alt="Home icon"
                   draggable="false"
                   class="link-icon">
              Home
            </a>
          </li>

          <li>
            <a href="https://robo-go.is-a.dev/Games">
              <img src="games.ico"
                   alt="Game icon"
                   draggable="false"
                   class="link-icon">
              Games
            </a>
          </li>

          <li>
            <a href="https://robo-go.is-a.dev/about">
              <img src="i.ico"
                   alt="Info icon"
                   draggable="false"
                   class="link-icon">
              About
            </a>
          </li>

        </ul>
      </nav>

      <!-- Content -->
      <div class="card-body">

        <h2 class="section-title">
          <img src="i.ico"
               alt=""
               draggable="false"
               class="heading-icon">
          <b>My Games</b>
        </h2>

        <p class="intro-text">
          Here is a selection of my games. Click on a window to play or discover!
        </p>

        <!-- Game grid -->
        <div class="games-grid" style="display:flex; flex-wrap:wrap; gap:20px;">

          <!-- Game 1 -->
          <div class="window dark active" style="width:250px;">

            <div class="title-bar">
              <div style="user-select: none;" class="title-bar-text">
                Mr FunnyFace
              </div>

              <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
              </div>
            </div>

            <div class="window-body">

              <img src="ddfsnap.png"
                   alt="Mr FunnyFace"
                   draggable="false"
                   style="width:100%; border-radius:6px;">

              <p class="game-author" style="color:#000;">
                Made by:
                <img src="favicon.png"
                     alt="RoBo_Go"
                     draggable="false"
                     style="height:25px; width:auto; vertical-align:middle;">
              </p>

              <section class="field-row"
                       style="justify-content:flex-end; margin-top:10px;">

                <a href="https://robo-go.github.io/pagemrFunnyFace"
                   target="_blank">

                  <button style="user-select: none;"
                          class="win7-button">
                    Play
                  </button>

                </a>

              </section>
            </div>
          </div>


          <!-- Game 2 -->
          <div class="window dark active" style="width:250px;">

            <div class="title-bar">
              <div style="user-select: none;" class="title-bar-text">
                Coming Soon
              </div>

              <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
              </div>
            </div>

            <div class="window-body">

              <img src="coming soon.png"
                   alt="Game coming soon"
                   draggable="false"
                   style="width:100%; border-radius:6px;">

              <p class="game-author"
                 draggable="false"
                 style="color:#000;">

                Made by:
                <img src="favicon.png"
                     alt="RoBo_Go"
                     draggable="false"
                     style="height:25px; width:auto; vertical-align:middle;">

              </p>

              <section class="field-row"
                       style="justify-content:flex-end; margin-top:10px;">

                <button class="win7-button" disabled>
                  Play
                </button>

              </section>
            </div>
          </div>


          <!-- Game 3 -->
          <div class="window dark active" style="width:250px;">

            <div class="title-bar">
              <div style="user-select: none;" class="title-bar-text">
                Coming Soon
              </div>

              <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
              </div>
            </div>

            <div class="window-body">

              <img src="coming soon.png"
                   alt="Coming soon"
                   draggable="false"
                   style="width:100%; border-radius:6px;">

              <p class="game-author" style="color:#000;">

                Made by:
                <img src="favicon.png"
                     alt="RoBo_Go"
                     draggable="false"
                     style="height:25px; width:auto; vertical-align:middle;">

              </p>

              <section class="field-row"
                       style="justify-content:flex-end; margin-top:10px;">

                <button class="win7-button" disabled>
                  Play
                </button>

              </section>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</body>
</html>
